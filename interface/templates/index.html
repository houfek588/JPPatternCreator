<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pattern Creator</title>
    <link rel="stylesheet" href="/static/basic_style.css">

</head>
<body>
    <header>
        <img src="/static/logo.png" alt="Logo">
        <div class="title">Pattern Creator Application</div>
        <div style="width: 40px;"></div>
    </header>
    <div class="controls">
        <div class="group">
            <h3>Body measurements</h3>
            <table>
                <tr><td>Height</td><td>VP</td><td><input type="text" id="vp"></td></tr>
                <tr><td>Chest</td><td>OH</td><td><input type="text" id="oh"></td></tr>
                <tr><td>Waist</td><td>OP</td><td><input type="text" id="op"></td></tr>
                <tr><td>Hips</td><td>OS</td><td><input type="text" id="os"></td></tr>
                <tr><td>Back length</td><td>DZ</td><td><input type="text" id="dz"></td></tr>
                <tr><td>Hip length</td><td>DB</td><td><input type="text" id="db"></td></tr>
            </table>
        </div>
        <div class="group">
            <h3>Legs measurements</h3>
            <table>
                <tr><td>Side length</td><td>BDK</td><td><input type="text" id="bdk"></td></tr>
                <tr><td>Crotch length</td><td>KD</td><td><input type="text" id="kd"></td></tr>
                <tr><td>Thigh</td><td>OST</td><td><input type="text" id="ost"></td></tr>
                <tr><td>Above knee</td><td>ONK</td><td><input type="text" id="onk"></td></tr>
                <tr><td>Calf</td><td>UL</td><td><input type="text" id="ul"></td></tr>
                <tr><td>Ankle</td><td>OK</td><td><input type="text" id="ok"></td></tr>
            </table>
        </div>
    </div>
    <div class="buttons">
        <button onclick="generate()">Generate</button>
        <button onclick="saveInputs()">Save Inputs</button>
    </div>
    <div class="main">
        <div class="sliders">
            <label>Slider 1 <input type="range" id="slider1" min="0" max="10"></label>
            <label>Slider 2 <input type="range" id="slider2" min="0" max="10"></label>
        </div>
        <div id="view" class="view"></div>
        <div class="sliders">
            <label>Slider 3 <input type="range" id="slider3" min="0" max="10"></label>
            <label>Slider 4 <input type="range" id="slider4" min="0" max="10"></label>
        </div>
    </div>
    <div class="buttons">
        <button onclick="exportPDF()">Export PDF</button>
        <button onclick="exportPNG()">Export PNG</button>
    </div>
    <footer>
        Contact us: <a href="mailto:info@patterncreator.app">info@patterncreator.app</a> |
        <a href="https://facebook.com/patterncreator" target="_blank">Facebook</a> |
        <a href="https://instagram.com/patterncreator" target="_blank">Instagram</a>
    </footer>
    <script>
        function getValues() {
            const sliders = {
                slider1: document.getElementById('slider1').value,
                slider2: document.getElementById('slider2').value,
                slider3: document.getElementById('slider3').value,
                slider4: document.getElementById('slider4').value
            };
            const inputs = {};
            ['vp','oh','op','os','dz','db','bdk','kd','ost','onk','ul','ok'].forEach(id => {
                inputs[id] = document.getElementById(id).value;
            });
            return { sliders, inputs };
        }

        function generate() {
            fetch('/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(getValues())
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('view').innerHTML = data.svg;
            });
        }

        ['slider1','slider2','slider3','slider4'].forEach(id => {
            document.getElementById(id).addEventListener('input', generate);
        });

        function exportPDF() {
            const svg = document.getElementById('view').innerHTML;
            fetch('/export/pdf', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ svg })
            })
            .then(res => res.blob())
            .then(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'pattern.pdf';
                a.click();
                URL.revokeObjectURL(url);
            });
        }

        function exportPNG() {
            const svg = document.getElementById('view').innerHTML;
            fetch('/export/png', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ svg })
            })
            .then(res => res.blob())
            .then(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'pattern.png';
                a.click();
                URL.revokeObjectURL(url);
            });
        }

        function saveInputs() {
            const values = getValues();
            fetch('/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(values)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "ok") alert("Data saved.");
                else alert("Error: " + data.message);
            });
        }
    </script>
</body>
</html>
